<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <meta
      name="description"
      content="Collez la sortie d'un traceroute et visualisez-la sur un globe 3D ou une carte 2D."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>JemaTrace — Coller un traceroute</title>

    <!--
      Thème appliqué avant le premier rendu : sans ce script, une page en thème
      clair s'afficherait une fraction de seconde en sombre. La préférence est
      lue dans `gt2_theme_mode` (system/dark/light) ; sans choix explicite, on
      suit immédiatement le thème clair/sombre du système.
    -->
    <script>
      try {
        var m = document.cookie.match(/(?:^|; )gt2_theme_mode=([^;]*)/);
        var pref = m ? decodeURIComponent(m[1]) : 'system';
        // `system` (valeur par défaut) ou cookie inconnu : on interroge l'OS.
        if (pref !== 'light' && pref !== 'dark') {
          pref =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = pref;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', pref === 'light' ? '#eef2f7' : '#070b14');
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Mêmes polices que jemaos.com : Inter pour le texte, Manrope pour les titres. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
